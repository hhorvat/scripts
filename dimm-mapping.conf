# ============================================================================
# LENOVO THINKSYSTEM SR650 - FIRST GENERATION
# ============================================================================

[LENOVO_SR650]
manufacturer=Lenovo
manufacturer_match_regex=Lenovo
product_match_regex=ThinkSystem SR650
mapping_status=REFERENCE_ONLY
mapping_scope=Physical layout only; EDAC translation not validated
cpu_socket_count=2
channels_per_cpu=6
dimms_per_channel=2
dimms_per_cpu=12
physical_layout=12 DIMM connectors per processor in the first-generation SR650 configuration
physical_slot_scheme=Lenovo_system_board_connector_numbering

# This profile is for the first-generation ThinkSystem SR650 only.
# Do not apply it to SR650 V2, SR650 V3 or SR650 V4.
# No edac_map_* entries intentionally provided.
# Verify exact system type/model, board, processor, firmware and EDAC driver.


# ============================================================================
# GENERIC / UNKNOWN PLATFORM
# ============================================================================

[GENERIC]
mapping_status=UNSUPPORTED
mapping_scope=EDAC logical location only
physical_layout=Unknown
physical_slot_scheme=NONE

# For an unknown platform, report the EDAC label and counters only.
# Never generate a physical connector name by guessing.

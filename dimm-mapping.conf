# DIMM DIAGNOSE - CENTRAL PLATFORM MAPPING DATABASE
# File: dimm-mapping.conf
# Format: INI-like key=value records; this file is DATA, NOT executable Bash.
# Encoding: UTF-8
#
# PURPOSE
#   Identify known server platforms and describe their physical DIMM layouts.
#   Where a verified EDAC-to-physical-slot translation exists, provide it.
#
# SAFETY RULE
#   physical_layout describes the manufacturer's connector arrangement.
#   edac_translation describes how Linux EDAC indices map to those connectors.
#   These are NOT interchangeable.
#
#   Only mapping_status=VERIFIED may be used for automatic physical-slot
#   identification. REFERENCE_ONLY means the physical layout is documented,
#   but EDAC channel/index translation has not been validated on the platform.
#
#   The only executable translation included here is the existing
#   HPE ProLiant BL460c Gen8 mapping from dimm-diagnose.sh v0.5.
#   Confirm it remains correct for the target system/firmware/EDAC driver.
#
# PARSER NOTES
#   - Section names are unique identifiers.
#   - Keys are simple key=value pairs.
#   - Lines beginning with # and blank lines are comments.
#   - Values are plain strings or integers; do not eval/source this file.
#   - A parser should reject duplicate keys, unknown required fields,
#     malformed integers, and unsupported mapping_status values.
#   - Regex values below are intended for matching dmidecode product strings.
#
# SUPPORTED MODEL PROFILES
#   HPE ProLiant BL460c Gen8
#   HPE ProLiant DL380 Gen10
#   Dell PowerEdge R630
#   Dell PowerEdge R740
#   Dell PowerEdge R750
#   Lenovo ThinkSystem SR650 (first generation)
#
# General guidance:
#   EDAC labels are driver-specific. SrcID may not always be a zero-based
#   socket index, and Chan#/DIMM# may not match vendor channel/connector
#   numbering. Verify these semantics for each kernel and EDAC driver.
#   SMBIOS Type 17 inventory is useful for cross-checking, but its Locator
#   strings are firmware-provided and may differ between firmware revisions.


# ============================================================================
# HPE PROLIANT BL460c GEN8
# ============================================================================

[HPE_BL460C_GEN8]
manufacturer=HPE
manufacturer_match_regex=(HP|HPE)
product_match_regex=BL460c Gen8
mapping_status=VERIFIED
mapping_scope=EDAC channel and DIMM index to DMI slot, as implemented in the original script
cpu_socket_count=2
channels_per_cpu=4
dimms_per_channel=2
dimms_per_cpu=8
physical_layout=Per-processor DIMM labels A through H
physical_slot_scheme=PROC_n_DIMM_n_and_Pn-letter

# EDAC channel:index -> DMI DIMM slot number
# This mapping is specific to the BL460c Gen8 implementation.
edac_map_1_0=1
edac_map_1_1=2
edac_map_2_0=3
edac_map_2_1=4
edac_map_3_0=8
edac_map_3_1=7
edac_map_4_0=6
edac_map_4_1=5

# DMI DIMM slot number -> physical letter
slot_label_1=A
slot_label_2=E
slot_label_3=B
slot_label_4=F
slot_label_5=H
slot_label_6=D
slot_label_7=G
slot_label_8=C

# Validation note:
#   The EDAC label convention expected by the original script is:
#   SrcID#<socket>_Chan#<channel>_DIMM#<index>
#   The script currently assumes PROC = SrcID + 1. Confirm on the target.


# ============================================================================
# HPE PROLIANT DL380 GEN10
# ============================================================================

[HPE_DL380_GEN10]
manufacturer=HPE
manufacturer_match_regex=(HP|HPE)
product_match_regex=DL380 Gen10
mapping_status=REFERENCE_ONLY
mapping_scope=Physical layout only; EDAC translation not validated
cpu_socket_count=2
channels_per_cpu=6
dimms_per_channel=2
dimms_per_cpu=12
physical_layout=12 DIMM connectors per processor; six memory channels with up to two DIMMs per channel
physical_slot_scheme=HPE_processor_specific_DIMM_numbering

# No edac_map_* entries intentionally provided.
# Do not assume EDAC channel numbers correspond to HPE channel labels.
# Verify exact system board, processor generation, BIOS and EDAC driver.
# SMBIOS Type 17 Locator strings should be collected from the target server.


# ============================================================================
# DELL POWEREDGE R630
# ============================================================================

[DELL_R630]
manufacturer=Dell Inc.
manufacturer_match_regex=Dell
product_match_regex=PowerEdge R630
mapping_status=REFERENCE_ONLY
mapping_scope=Physical layout only; EDAC translation not validated
cpu_socket_count=2
channels_per_cpu=4
dimms_per_channel=3
dimms_per_cpu=12
physical_layout=Up to 12 DIMM connectors per processor; four memory channels with up to three DIMMs per channel
physical_slot_scheme=Dell_processor_A_or_B_connector_labels

# Connector naming convention:
#   Processor 1 uses A-series labels (A1...A12).
#   Processor 2 uses B-series labels (B1...B12).
#
# No edac_map_* entries intentionally provided.
# Confirm channel/connector associations using the exact R630 service manual
# and actual EDAC labels. Do not infer EDAC Chan# from connector suffixes.


